<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestor de Libros Moderno">
  <title>Biblioteca Digital | Books API</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-mesh"></div>
  
  <div class="app-container">
    <header class="app-header">
      <h1>Mi Biblioteca</h1>
      <p>Gestor de libros con API REST y PostgreSQL</p>
    </header>

    <main>
      <section class="form-section glass-panel">
        <h2 id="form-title">Agregar Nuevo Libro</h2>
        <form id="book-form">
          <input type="hidden" id="book-id">
          <div class="input-group">
            <label for="title">Título del Libro</label>
            <input type="text" id="title" required placeholder="Ej. El Principito">
          </div>
          <div class="input-group">
            <label for="author">Autor</label>
            <input type="text" id="author" required placeholder="Ej. Antoine de Saint-Exupéry">
          </div>
          <div class="input-group">
            <label for="published_year">Año de Publicación</label>
            <input type="number" id="published_year" required placeholder="Ej. 1943">
          </div>
          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn-primary">Guardar Libro</button>
            <button type="button" id="cancel-btn" class="btn-secondary hidden">Cancelar Edición</button>
          </div>
        </form>
      </section>

      <section class="books-section">
        <h2>Libros Guardados</h2>
        <div id="loading" class="loading">Cargando libros...</div>
        <div class="books-grid" id="books-grid">
          <!-- Los libros se inyectarán aquí desde JavaScript -->
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
